version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: "/node"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: maven
    directory: "/java"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
