name: Update README

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-readme:
    name: Regenerate auto-generated README sections
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Produce coverage report
        run: |
          dotnet test tests/MessageFlow.Tests/MessageFlow.Tests.csproj \
            --configuration Release \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=cobertura \
            -p:CoverletOutput=../../artifacts/coverage/

      - name: Check README on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/update_readme.py --check

      - name: Update and commit README
        if: github.event_name != 'pull_request'
        run: |
          python scripts/update_readme.py
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-update README"
            git push
          fi
