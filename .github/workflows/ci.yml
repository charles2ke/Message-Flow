name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The solution uses the .slnx format and the tests, samples and benchmarks target net10.0
      # (the library also multi-targets net8.0), so the .NET 10 SDK is required to build and test.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MessageFlow.slnx

      - name: Build
        run: dotnet build MessageFlow.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format MessageFlow.slnx --verify-no-changes --no-restore

      - name: Test with 100% coverage gate
        run: |
          dotnet test tests/MessageFlow.Tests/MessageFlow.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat="cobertura%2cjson" \
            -p:CoverletOutput=../../artifacts/coverage/ \
            -p:Threshold=100 \
            -p:ThresholdType="line%2cbranch%2cmethod"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: artifacts/coverage/

      # Reuses the restore of this job instead of paying for a second checkout and restore.
      - name: Check for vulnerable and deprecated packages
        run: |
          dotnet list MessageFlow.slnx package --vulnerable --include-transitive > vulnerable.txt
          cat vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi
          dotnet list MessageFlow.slnx package --deprecated

  readme:
    name: Regenerate auto-generated README sections
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # The coverage badge comes from the Cobertura report produced by build-test, so the
      # test suite does not have to run a second time.
      - name: Download the coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: artifacts/coverage

      - name: Check README on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/update_readme.py --check

      - name: Update and commit README
        if: github.event_name != 'pull_request'
        run: |
          python scripts/update_readme.py
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-update README"
            git push
          fi

  performance:
    name: Performance benchmarks
    # Benchmarks are the slowest job and nothing gates on their result, so they run on main
    # and on demand instead of on every pull request, and only once the build is known to be good.
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Run benchmarks
        run: |
          dotnet run \
            --project benchmarks/MessageFlow.Benchmarks/MessageFlow.Benchmarks.csproj \
            --configuration Release -- \
            --filter '*' --job short --exporters github markdown

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: BenchmarkDotNet.Artifacts/results/
